name: Non-Archimedean Math Validation CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate-framework:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4  # Node 24 Compatible Tier

    - name: Set Up Python Environment
      uses: actions/setup-python@v5 # Node 24 Compatible Tier
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Execute Mathematical Invariant Tests
      run: |
        python -m pytest tests/
